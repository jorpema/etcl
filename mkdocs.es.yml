# ================================================================
# Web del módulo 5104 · versión en CASTELLANO (/es/)
# Hereda de mkdocs.yml y solo cambia lo que depende del idioma
# ================================================================
INHERIT: mkdocs.yml
site_name: Extracción, transformación y carga de datos
site_description: "Módulo 5104 del Curso de Especialización en Aprendizaje automático: gestión de datos y entrenamiento"
site_url: https://jorpema.github.io/etcl/es/
edit_uri: edit/main/docs/es/
docs_dir: docs/es
site_dir: site/es
copyright: >-
  © 2026 Jorge Penalba Mateu y Rafa Vidal Semper ·
  <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="license noopener">CC BY-SA 4.0</a><br>
  Material desarrollado con IA con la revisión de Jorge Penalba Mateu y Rafa Vidal Semper.
  Los contenidos de otros autores se indican en cada página y conservan su licencia.

theme:
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: En esta página
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      auto_append:
        - includes/glosario.md

extra:
  alternate:
    - name: Valencià
      link: /etcl/
      lang: ca
    - name: Castellano
      link: /etcl/es/
      lang: es
  social:
    - icon: fontawesome/brands/creative-commons
      link: https://creativecommons.org/licenses/by-sa/4.0/deed.es
      name: Licencia CC BY-SA 4.0
    - icon: fontawesome/brands/github
      link: https://github.com/jorpema/etcl
    - icon: material/web
      link: https://alapvi.github.io/sbd/
      name: Apuntes de Sistemas de Big Data (Alberto Aparicio Vila)

