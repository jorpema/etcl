      - "S02 · Gestores y formatos": p1/s02-gestors-formats.md
      - "S03 · Entornos y arquitecturas": p1/s03-entorns-arquitectures.md
      - "S04 · Modelo multidimensional": p1/s04-model-multidimensional.md
      - "S05 · Práctica: OLTP y DDL": p1/s05-practica-ddl.md
      - "S06 · Práctica: carga del DW": p1/s06-practica-carrega.md
      - "S07 · Práctica: SCD1 y DCL": p1/s07-practica-scd-dcl.md
      - "S08 · Práctica: carga masiva": p1/s08-practica-copy.md
      - "S09 · Práctica: benchmark y paralelismo": p1/s09-practica-benchmark.md
      - "S10 · MongoDB I": p1/s10-mongodb-1.md
      - "S11 · MongoDB II": p1/s11-mongodb-2.md
      - "S12 · Elasticsearch": p1/s12-elasticsearch.md
